name: Build & Deploy Nite Dashboard

on:
  schedule:
    - cron: '0 */3 * * *' # every 3 hours
  push:
    branches: [main]
  workflow_dispatch: {} # manual "Run workflow" button

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      # Every knob is passed explicitly — the script has Nite defaults, but a
      # silent fallback to a hardcoded value is exactly how a dashboard ends up
      # quietly reporting the wrong account.
      - name: Fetch fresh Meta data + creatives
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_ACCOUNT_ID: ${{ vars.META_ACCOUNT_ID }}
          META_API_VERSION: v21.0
          PROJECT_NAME: Nite
          MIN_DATE: '2026-05-01'
          LEAD_TYPE: lead
          PREVIEW_FORMAT: INSTAGRAM_STORY
          PLAN_BUDGET: '6000'
          PLAN_LEADS: '300'
          PLAN_CPL: '20'
        run: node scripts/fetch-meta.mjs

      # CRM layer: the Bitrix24 export that the Apps Script bound to the sheet keeps
      # fresh (scripts/bitrix-leads-to-sheets.gs). Not --strict on purpose: a broken
      # sheet keeps the last deployed CRM layer and flags it in the UI, while the fresh
      # Meta numbers still deploy. DASHBOARD_PASSWORD lets it read that layer back.
      # CRM_MIN_DATE: the qual rule (Re-contact and beyond) holds only for leads from
      # 14.10.2026 — earlier history is excluded on purpose (NITE decision, 19.10).
      # SHEET_ID is a secret, not a variable, on purpose: this repo and its Actions
      # logs are public, the sheet is readable by link, and secrets get masked in logs.
      - name: Join CRM data from Google Sheets
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
          SHEET_TAB: leads
          CRM_MIN_DATE: '2026-10-14'
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
          DASHBOARD_URL: https://igoradakhovskiy-cyber.github.io/nite-dashboard/
        run: node scripts/fetch-crm.mjs

      - name: Encrypt dataset with the dashboard password
        env:
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
        run: node scripts/encrypt-data.mjs

      - run: npm run build
      # Pages is enabled once out-of-band (`gh api -X POST repos/<repo>/pages
      # -f build_type=workflow`); `enablement: true` here fails on a fresh repo
      # because the Actions token cannot create the site.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
