name: Keepalive

# GitHub switches off scheduled workflows in a public repo after 60 days without
# a commit (state `disabled_inactivity`). Nothing gets committed here in normal
# operation — the dashboard only rebuilds — so the 3-hourly refresh silently died
# on three dashboards in September 2026. A monthly commit keeps the repo "active";
# the enable step also revives deploy.yml if it was switched off anyway.
#
# Pushes made with GITHUB_TOKEN do not trigger other workflows, so this never
# causes an extra deploy.

on:
  schedule:
    - cron: '17 5 1 * *' # 05:17 UTC on the 1st of every month
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Commit a timestamp
        run: |
          date -u +%Y-%m-%dT%H:%M:%SZ > .github/keepalive
          git config user.name 'github-actions[bot]'
          git config user.email '41898729+github-actions[bot]@users.noreply.github.com'
          git add .github/keepalive
          git commit -m 'chore: monthly keepalive'
          git push

      - name: Make sure the dashboard rebuild is enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable deploy.yml --repo "$GITHUB_REPOSITORY"
